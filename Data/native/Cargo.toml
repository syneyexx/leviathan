[workspace]
resolver = "2"
members = ["leviathan_data_plane"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Proprietary"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sha2 = "0.10"
tempfile = "3"
clap = { version = "4", features = ["derive"] }
hex = "0.4"
