[package]
name = "run_leviathan"
version = "0.1.0"
description = "LEVIATHAN backend host"
edition = "2021"
license = "MIT"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
leviathan-host-core = { path = "../host-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
