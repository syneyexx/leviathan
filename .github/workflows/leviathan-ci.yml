# LEVIATHAN CI — Data/ only. HADES/ and editor/ are out of scope.
name: leviathan-ci

on:
  push:
    paths:
      - "Data/**"
      - "requirements.txt"
      - "requirements-dev.txt"
      - ".github/workflows/leviathan-ci.yml"
      - "scripts/leviathan_ci.sh"
      - "scripts/verify_leviathan.py"
      - "scripts/verify_frontier_reasoning.py"
      - "scripts/verify_trading_100.py"
  pull_request:
    paths:
      - "Data/**"
      - "requirements.txt"
      - "requirements-dev.txt"
      - ".github/workflows/leviathan-ci.yml"
      - "scripts/leviathan_ci.sh"
      - "scripts/verify_leviathan.py"
      - "scripts/verify_frontier_reasoning.py"
      - "scripts/verify_trading_100.py"

concurrency:
  group: leviathan-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests + security + rounds
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Backend unit + integration
        run: python -m pytest Data/backend/tests -q --tb=line
      - name: Security-sensitive (Round 8)
        run: python -m pytest Data/backend/tests/test_round8_security_isolation.py -q --tb=line
      - name: Fixture ≠ production honesty
        run: >
          python -m pytest
          Data/backend/tests/test_round7_browser_multimodal.py
          Data/backend/tests/test_round9_product_truth.py
          Data/backend/tests/test_round10_ci_release_gates.py
          -k "fixture or CiPlan or not_applicable or ProductTruth"
          -q --tb=line
      - name: Frontier round exit gates
        run: python -m pytest Data/backend/tests/test_round*.py -q --tb=line
      - name: CI plan honesty (no skip→pass)
        run: python -c "from Data.modules.release import default_leviathan_ci_plan, GateMeasurement; p=default_leviathan_ci_plan(); d=p.public_dict(); assert d['truth']['skipped_unavailable_is_not_success']; assert all(s.measurement==GateMeasurement.NOT_APPLICABLE for s in p.suites if s.suite_id in ('hades','editor')); print('ci-plan-ok', d['summary'])"
      - name: Offline frontier + trading verifiers (honest incomplete)
        run: python scripts/verify_leviathan.py --allow-incomplete --write-report

  frontend:
    name: Frontend typecheck + lint + test + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Data/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: Data/frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm run test
      - name: Production build
        run: npm run build
      - name: Upload frontend dist for release gates
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: Data/frontend/dist
          if-no-files-found: error

  release-gates:
    name: Release gates under CI profile
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    env:
      LEVIATHAN_CI_RELEASE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Download frontend dist
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: Data/frontend/dist
      - name: Assert dist present
        run: test -f Data/frontend/dist/index.html
      - name: Shipable honesty under CI (no soft-pass skips)
        run: |
          python - <<'PY'
          import os
          assert os.environ.get("LEVIATHAN_CI_RELEASE") == "1"
          from Data.modules.release import (
              GateCheck,
              GateMeasurement,
              GateSeverity,
              ReleaseGateRunner,
              ci_release_mode,
              is_shipable,
              measurement_counts_as_success,
          )
          from Data.modules.evaluation import MeasurementState, measurement_is_pass
          from Data.modules.artifacts.validate import validate_artifact_bytes

          assert ci_release_mode()
          assert MeasurementState.NOT_APPLICABLE.value == "NOT_APPLICABLE"
          assert not measurement_is_pass(MeasurementState.NOT_APPLICABLE)
          assert not measurement_counts_as_success(GateMeasurement.NOT_APPLICABLE)

          # Soft WARN fail must not ship under CI.
          soft = ReleaseGateRunner(
              checks=[
                  lambda: GateCheck(
                      "frontend_dist",
                      "Frontend dist",
                      GateSeverity.WARN,
                      False,
                      "missing",
                      measurement=GateMeasurement.FAIL,
                  )
              ]
          ).run()
          assert soft.ready  # WARN does not flip ready
          assert not is_shipable(soft, ci_release=True)

          # Artifact unknown type: unmeasured ≠ validated ok.
          result = validate_artifact_bytes(b"raw-bytes", artifact_type="blob", filename="x.bin")
          assert result["ok"] is False
          assert result["measurement"] == "UNMEASURED"
          assert result["truth"]["unmeasured_is_not_validated"]

          from Data.backend.main import release_gates
          report = release_gates.run()
          frontend = next(c for c in report.checks if c.gate_id == "frontend_dist")
          assert frontend.measurement == GateMeasurement.PASS, frontend
          assert frontend.severity == GateSeverity.BLOCK  # CI profile
          eval_g = next(c for c in report.checks if c.gate_id == "evaluation_relevance")
          assert not measurement_counts_as_success(eval_g.measurement)
          ship = is_shipable(report)
          print("ready", report.ready, "shipable", ship, "eval", eval_g.measurement.value)
          # May be False while foundation is UNMEASURED — that is honest, not a soft PASS.
          if ship:
              assert all(
                  c.measurement in {GateMeasurement.PASS, GateMeasurement.NOT_APPLICABLE, GateMeasurement.UNMEASURED}
                  or c.severity == GateSeverity.INFO
                  for c in report.checks
              )
          print("release-gates-ok")
          PY

  # Explicitly document out-of-scope trees so a green CI is never
  # interpreted as HADES/editor certification.
  scope-honesty:
    name: Scope honesty (HADES/editor NOT_APPLICABLE)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Assert scope exclusions
        run: |
          python - <<'PY'
          from pathlib import Path
          assert Path("Data").is_dir()
          # Presence of HADES/editor must not be required for CI green.
          print("HADES present:", Path("HADES").exists(), "— NOT_APPLICABLE in LEVIATHAN CI")
          print("editor present:", Path("editor").exists(), "— NOT_APPLICABLE in LEVIATHAN CI")
          print("scope-ok")
          PY
