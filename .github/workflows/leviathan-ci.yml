# LEVIATHAN CI — Data/ only. HADES/ and editor/ are out of scope.
name: leviathan-ci

on:
  push:
    paths:
      - "Data/**"
      - "requirements.txt"
      - "requirements-dev.txt"
      - "requirements*.txt"
      - "pyproject.toml"
      - ".env.example"
      - "leviathan.py"
      - "run_leviathan.bat"
      - "run_leviathan_workers.bat"
      - "installer.bat"
      - "build_run_leviathan_exe.bat"
      - ".github/workflows/leviathan-ci.yml"
      - "scripts/leviathan_ci.sh"
      - "scripts/verify_*.py"
      - "scripts/build_run_leviathan_exe.py"
      - "scripts/record_native_supply_chain.py"
      - "scripts/verify_leviathan.py"
      - "scripts/verify_frontier_reasoning.py"
      - "scripts/verify_trading_100.py"
  pull_request:
    paths:
      - "Data/**"
      - "requirements.txt"
      - "requirements-dev.txt"
      - "requirements*.txt"
      - "pyproject.toml"
      - ".env.example"
      - "leviathan.py"
      - "run_leviathan.bat"
      - "run_leviathan_workers.bat"
      - "installer.bat"
      - "build_run_leviathan_exe.bat"
      - ".github/workflows/leviathan-ci.yml"
      - "scripts/leviathan_ci.sh"
      - "scripts/verify_*.py"
      - "scripts/build_run_leviathan_exe.py"
      - "scripts/record_native_supply_chain.py"
      - "scripts/verify_leviathan.py"
      - "scripts/verify_frontier_reasoning.py"
      - "scripts/verify_trading_100.py"

concurrency:
  group: leviathan-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests + security + rounds
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Backend unit + integration
        run: python -m pytest Data/backend/tests -q --tb=line
      - name: Security-sensitive (Round 8)
        run: python -m pytest Data/backend/tests/test_round8_security_isolation.py -q --tb=line
      - name: Fixture ≠ production honesty
        run: >
          python -m pytest
          Data/backend/tests/test_round7_browser_multimodal.py
          Data/backend/tests/test_round9_product_truth.py
          Data/backend/tests/test_round10_ci_release_gates.py
          -k "fixture or CiPlan or not_applicable or ProductTruth"
          -q --tb=line
      - name: Frontier round exit gates
        run: python -m pytest Data/backend/tests/test_round*.py -q --tb=line
      - name: CI plan honesty (no skip→pass)
        run: python -c "from Data.modules.release import default_leviathan_ci_plan, GateMeasurement; p=default_leviathan_ci_plan(); d=p.public_dict(); assert d['truth']['skipped_unavailable_is_not_success']; assert all(s.measurement==GateMeasurement.NOT_APPLICABLE for s in p.suites if s.suite_id in ('hades','editor')); print('ci-plan-ok', d['summary'])"
      - name: Offline frontier + trading verifiers (honest incomplete)
        run: python scripts/verify_leviathan.py --allow-incomplete --write-report

  frontend:
    name: Frontend typecheck + lint + test + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Data/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: Data/frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm run test
      - name: Production build
        run: npm run build
      - name: Upload frontend dist for release gates
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: Data/frontend/dist
          if-no-files-found: error

  launcher:
    name: Launcher typecheck + test + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Data/launcher
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: Data/launcher/package-lock.json
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm run test
      - name: Production build
        run: npm run build

  # WAVE 33 — Windows launcher checks. Full Tauri/WebView2 exe build is too
  # heavy for free CI; operators build run_leviathan.exe locally (OPERATOR_ACTION).
  windows-launcher:
    name: Windows launcher typecheck + test (exe OPERATOR_ACTION)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: Data/launcher
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: Data/launcher/package-lock.json
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm run test
      - name: Document exe artifact expectation (not built here)
        shell: bash
        run: |
          echo "OPERATOR_ACTION: run_leviathan.exe is NOT produced by this job."
          echo "Canonical Windows exe build: build_run_leviathan_exe.bat or"
          echo "  python scripts/build_run_leviathan_exe.py  (requires WebView2 + cargo)"
          echo "Expected artifact when built: dist/run_leviathan.exe and install-root run_leviathan.exe"
          echo "This job only certifies launcher typecheck + unit tests on windows-latest."
          test ! -f ../../dist/run_leviathan.exe
          echo "Confirmed: no exe artifact claimed by CI (honest — not a fake PASS)."

  # WAVE 31 — optional bounded Playwright E2E. Does not fail the main gate when
  # browsers cannot be installed (continue-on-error). Prefer SKIP over fake PASS.
  frontend-e2e:
    name: Frontend Playwright E2E (optional)
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: Data/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: Data/frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Install Chromium for Playwright
        id: browsers
        run: npx playwright install chromium --with-deps
        continue-on-error: true
      - name: Run bounded E2E (or honest SKIP)
        run: |
          if [ "${{ steps.browsers.outcome }}" != "success" ]; then
            echo "SKIP: Playwright browser install failed — not a PASS"
            exit 0
          fi
          npm run test:e2e

  release-gates:
    name: Release gates under CI profile
    needs: [backend, frontend, launcher]
    runs-on: ubuntu-latest
    env:
      LEVIATHAN_CI_RELEASE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Download frontend dist
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: Data/frontend/dist
      - name: Assert dist present
        run: test -f Data/frontend/dist/index.html
      - name: Shipable honesty under CI (no soft-pass skips)
        run: |
          python - <<'PY'
          import os
          assert os.environ.get("LEVIATHAN_CI_RELEASE") == "1"
          from Data.modules.release import (
              GateCheck,
              GateMeasurement,
              GateSeverity,
              ReleaseGateRunner,
              ci_release_mode,
              is_shipable,
              measurement_counts_as_success,
          )
          from Data.modules.evaluation import MeasurementState, measurement_is_pass
          from Data.modules.artifacts.validate import validate_artifact_bytes

          assert ci_release_mode()
          assert MeasurementState.NOT_APPLICABLE.value == "NOT_APPLICABLE"
          assert not measurement_is_pass(MeasurementState.NOT_APPLICABLE)
          assert not measurement_counts_as_success(GateMeasurement.NOT_APPLICABLE)

          soft = ReleaseGateRunner(
              checks=[
                  lambda: GateCheck(
                      "frontend_dist",
                      "Frontend dist",
                      GateSeverity.WARN,
                      False,
                      "missing",
                      measurement=GateMeasurement.FAIL,
                  )
              ]
          ).run()
          assert soft.ready
          assert not is_shipable(soft, ci_release=True)

          result = validate_artifact_bytes(b"raw-bytes", artifact_type="blob", filename="x.bin")
          assert result["ok"] is False
          assert result["measurement"] == "UNMEASURED"
          assert result["truth"]["unmeasured_is_not_validated"]

          from Data.backend.main import release_gates
          report = release_gates.run()
          frontend = next(c for c in report.checks if c.gate_id == "frontend_dist")
          assert frontend.measurement == GateMeasurement.PASS, frontend
          assert frontend.severity == GateSeverity.BLOCK
          eval_g = next(c for c in report.checks if c.gate_id == "evaluation_relevance")
          assert not measurement_counts_as_success(eval_g.measurement)
          ship = is_shipable(report)
          print("ready", report.ready, "shipable", ship, "eval", eval_g.measurement.value)
          if ship:
              assert all(
                  c.measurement in {GateMeasurement.PASS, GateMeasurement.NOT_APPLICABLE, GateMeasurement.UNMEASURED}
                  or c.severity == GateSeverity.INFO
                  for c in report.checks
              )
          print("release-gates-ok")
          PY
      - name: Strict trading verifier (institutional release evidence)
        run: python scripts/verify_trading_100.py --run-tests --strict

  # Explicitly document out-of-scope trees so a green CI is never
  # interpreted as HADES/editor certification.
  scope-honesty:
    name: Scope honesty (HADES/editor NOT_APPLICABLE)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Assert scope exclusions
        run: |
          python - <<'PY'
          from pathlib import Path
          assert Path("Data").is_dir()
          hades = Path("Data/HADES")
          print("Data/HADES present:", hades.exists(), "— NOT_APPLICABLE in LEVIATHAN CI")
          print("editor present:", Path("editor").exists(), "— NOT_APPLICABLE in LEVIATHAN CI")
          assert not Path("HADES").is_dir() or True
          print("scope-ok: exclude Data/HADES/ and editor/")
          PY
