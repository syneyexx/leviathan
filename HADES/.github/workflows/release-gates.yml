# Deterministic HADES release gates (ubuntu + windows).
# Host-optional capabilities (LM Studio, Puppeteer, physical Voice, Windows Job Objects)
# are NOT required for green CI. Vocabulary for host probes when run separately:
#   PASS | FAIL | SKIPPED | UNAVAILABLE | UNVERIFIED_ON_HOST | DEGRADED | SIMULATED_ONLY
#
# Supported matrix (must match package.json engines + backend/requirements.txt):
#   Node.js >= 22.13.0 (CI pins 22.13)
#   Python 3.12
name: release-gates

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      full_gate:
        description: "Force full release gate (includes production build + full backend suite)"
        type: boolean
        default: true

# The release workflow only needs to read repository contents. Keep GITHUB_TOKEN
# least-privileged even when a future repository default becomes more permissive.
permissions:
  contents: read

jobs:
  # Developer gate — not a substitute for full release validation.
  quick-gates:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.13"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install Node dependencies (lockfile)
        run: npm ci

      - name: Install Python dependencies (requirements; see dependency policy)
        run: python -m pip install -r backend/requirements.txt

      - name: Run quick developer gate
        run: python verify_hades.py --quick

      - name: Upload quick gate logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: quick-gate-logs-${{ matrix.os }}
          path: |
            .hades-verify-*.log
            verify-*.log
            docs/evidence/**
          if-no-files-found: ignore

      - name: Honesty note
        if: always()
        run: |
          cat <<'NOTE'
          quick-gates = developer gate only (may skip production build).
          Do NOT treat quick-gates alone as full release validation.
          Full release candidates must also pass the release-gates job.
          Optional host probes report PASS/FAIL/SKIPPED/UNAVAILABLE/UNVERIFIED_ON_HOST.
          Missing hardware must never be treated as PASS.
          NOTE

  # Canonical full release validation. Native configure/build/CTest/install is
  # owned by verify_hades.py so CI and local verification cannot silently drift.
  release-gates:
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && inputs.full_gate)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.13"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install Node dependencies (lockfile)
        run: npm ci

      - name: Install Python dependencies (requirements; see dependency policy)
        run: python -m pip install -r backend/requirements.txt

      - name: Run full release gate
        run: python verify_hades.py

      - name: Upload release gate logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-gate-logs-${{ matrix.os }}
          path: |
            .hades-verify-*.log
            verify-*.log
            docs/evidence/**
          if-no-files-found: ignore

      - name: Branch protection remaining admin action
        if: always()
        run: |
          cat <<'NOTE'
          Remaining admin action (BLOCKED_EXTERNAL if unauthorized):
          Require the stable "release-gates-required" status check on main.
          GitHub Actions billing/spending/account/runner limits can block CI entirely —
          that is an external blocker, not evidence of green software.
          NOTE

  # Stable branch-protection context. Matrix check names are intentionally not
  # the administrative contract; this job only passes if both mandatory matrix
  # jobs completed successfully on every configured OS.
  release-gates-required:
    name: release-gates-required
    if: >-
      always() &&
      (
        github.event_name == 'pull_request' ||
        (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
        (github.event_name == 'workflow_dispatch' && inputs.full_gate)
      )
    needs: [quick-gates, release-gates]
    runs-on: ubuntu-latest
    steps:
      - name: Require every mandatory gate
        env:
          QUICK_GATES_RESULT: ${{ needs.quick-gates.result }}
          RELEASE_GATES_RESULT: ${{ needs.release-gates.result }}
        run: |
          echo "quick-gates=$QUICK_GATES_RESULT"
          echo "release-gates=$RELEASE_GATES_RESULT"
          if [ "$QUICK_GATES_RESULT" != "success" ] || [ "$RELEASE_GATES_RESULT" != "success" ]; then
            echo "Mandatory release matrix did not fully pass."
            exit 1
          fi
          echo "All mandatory Ubuntu/Windows quick/full release gates passed."
